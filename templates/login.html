{% extends "base.html" %}
{% block title %}Log In &middot; BillAI{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-8 sm:my-12">
  <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 sm:p-8">
    <div class="text-center mb-6">
      <div class="w-12 h-12 mx-auto rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center text-white shadow-md shadow-brand-500/20 mb-4">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Welcome Back</h1>
      <p class="text-xs text-slate-500 mt-1">Sign in to access your bill scanner and expense dashboard</p>
    </div>

    <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
      <input type="hidden" name="next" value="{{ next_url or '' }}">

      <div>
        <label for="identifier" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
          Username or Email
        </label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
          </div>
          <input type="text" name="identifier" id="identifier" required autofocus
                 value="{{ identifier or '' }}"
                 placeholder="e.g. roshane or you@example.com"
                 class="w-full pl-10 pr-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm font-medium text-slate-900 shadow-xs">
        </div>
      </div>

      <div>
        <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
          Password
        </label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
          </div>
          <input type="password" name="password" id="password" required
                 placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
                 class="w-full pl-10 pr-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm text-slate-900 shadow-xs">
        </div>
      </div>

      <button type="submit"
              class="w-full py-3 px-4 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm shadow-md shadow-brand-500/25 transition flex items-center justify-center gap-2 mt-2">
        <span>Sign In</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
        </svg>
      </button>
    </form>

    <div class="mt-6 pt-5 border-t border-slate-200 text-center">
      <p class="text-xs text-slate-600">
        Don't have an account yet?
        <a href="{{ url_for('register') }}" class="font-bold text-brand-600 hover:text-brand-700 hover:underline ml-1">
          Create an account
        </a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
